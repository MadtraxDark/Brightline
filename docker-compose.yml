services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL no arquivo .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY no arquivo .env}
      BRIGHTLINE_CORS_ORIGINS: ${BRIGHTLINE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    restart: unless-stopped
    networks:
      - brightline

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BRIGHTLINE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - brightline

networks:
  brightline:
    driver: bridge
